[package]
name = "aegis-build"
version = "0.1.0"
edition = "2021"
description = "Build tool for the Aegis OS: combines kernel + user servers into a bootable disk image"

[build-dependencies]
bootloader = { version = "0.11", default-features = false, features = ["bios"] }
aegis-kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[workspace]
members = ["kernel", "servers/initfs", "servers/console"]

[profile.release]
opt-level = 2
lto = false
debug = true
