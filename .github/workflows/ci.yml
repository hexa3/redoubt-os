name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  boot-smoke:
    name: Host checks and QEMU boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview,rust-src
          targets: x86_64-unknown-none

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86

      - name: Validate bootable image
        env:
          REDOUBT_BOOT_TIMEOUT: 25s
        run: ./tools/check.sh
